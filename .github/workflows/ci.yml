name: Test supported Node.js versions

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install development dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Test plugin
        run: npm test 2>&1 | tee "$RUNNER_TEMP/tuya-tests.log"
      - name: Attach failure summary to the check
        if: failure()
        run: python3 .github/scripts/test-failure-summary.py "$RUNNER_TEMP/tuya-tests.log"
