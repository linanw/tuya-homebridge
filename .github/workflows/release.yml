name: Publish release notes

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v2.6.2 or v2.7.0-beta.1'
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract bilingual release notes
        run: node .github/scripts/release-notes.cjs "$RELEASE_TAG" > "$RUNNER_TEMP/tuya-release-notes.md"
      - name: Install development dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Test plugin
        run: npm test
      - name: Publish GitHub Release for Homebridge What's New
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(--prerelease=false --latest=true)
          if [[ "$(node -p "require('./package.json').version.includes('-')")" == true ]]; then
            release_args=(--prerelease=true --latest=false)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/tuya-release-notes.md" --draft=false "${release_args[@]}"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/tuya-release-notes.md" "${release_args[@]}"
          fi
