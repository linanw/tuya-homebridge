name: TuyaMetadataCompanion
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TuyaMetadataCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTS_MACCATALYST: YES
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    TARGETED_DEVICE_FAMILY: "2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  TuyaMetadataCompanion:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: TuyaMetadataCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.linanw.TuyaMetadataCompanion
        PRODUCT_NAME: Tuya Metadata Companion
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: TuyaMetadataCompanion.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      gatherCoverageData: false
